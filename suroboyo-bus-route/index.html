<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peta Suroboyo Bus</title>
  <meta name="description" content="Peta skematik interaktif rute Suroboyo Bus dan Wira-Wiri untuk warga dan wisatawan Surabaya.">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/marketing/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/marketing/favicon-180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/marketing/favicon-512.png" />
  <link rel="canonical" href="https://aryogilang.com/experiments/suroboyo-bus-route-map" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aryogilang.com/experiments/suroboyo-bus-route-map" />
  <meta property="og:title" content="Peta Suroboyo Bus" />
  <meta property="og:description" content="Peta skematik interaktif rute Suroboyo Bus dan Wira-Wiri untuk warga dan wisatawan Surabaya." />
  <meta property="og:image" content="https://aryogilang.com/assets/marketing/OG-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Peta Suroboyo Bus" />
  <meta name="twitter:description" content="Peta skematik interaktif rute Suroboyo Bus dan Wira-Wiri untuk warga dan wisatawan Surabaya." />
  <meta name="twitter:image" content="https://aryogilang.com/assets/marketing/OG-image.png" />
  <script>
    // Pasang tema yang tersimpan sebelum halaman digambar (mencegah kilatan terang saat memuat mode gelap).
    try {
      var m = localStorage.getItem('peta-waktu');
      var h = new Date().getHours();
      var auto = h >= 5 && h < 9 ? 'pagi' : h >= 9 && h < 15 ? 'siang' : h >= 15 && h < 18 ? 'sore' : 'malam';
      document.documentElement.dataset.waktu = m && m !== 'auto' && ['pagi', 'siang', 'sore', 'malam'].indexOf(m) >= 0 ? m : auto;
    } catch (e) { /* siang */ }
  </script>
  <link rel="preload" href="/suroboyo-bus-route/fonts/Geist-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/suroboyo-bus-route/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/suroboyo-bus-route/fonts/Nohemi-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/suroboyo-bus-route/css/style.css">
</head>
<body>
  <svg id="map" role="img" aria-label="Peta skematik rute Suroboyo Bus">
    <g id="viewport">
      <g id="layer-lines"></g>
      <g id="layer-stops"></g>
      <g id="layer-buses"></g>
    </g>
  </svg>

  <div id="banner" class="card" role="status" hidden></div>

  <nav class="page-nav" aria-label="Navigasi halaman">
    <a href="/" class="nav-btn">
      <svg class="nav-btn__icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M15 8C15 7.72386 14.7761 7.5 14.5 7.5L2.70711 7.5L5.85355 4.35355C6.04882 4.15829 6.04882 3.84171 5.85355 3.64645C5.65829 3.45118 5.34171 3.45118 5.14645 3.64645L1.14645 7.64645C0.951184 7.84171 0.951184 8.15829 1.14645 8.35355L5.14645 12.3536C5.34171 12.5488 5.65829 12.5488 5.85355 12.3536C6.04882 12.1583 6.04882 11.8417 5.85355 11.6464L2.70711 8.5H14.5C14.7761 8.5 15 8.27614 15 8Z" /></svg>
      Back to home
    </a>
    <span class="nav-btn-tip-wrapper">
      <button type="button" class="nav-btn nav-btn--disabled" aria-disabled="true" aria-describedby="nav-btn-tip">See how it was built</button>
      <span role="tooltip" id="nav-btn-tip" class="nav-btn-tip">
        Still writing up this case study
        <span aria-hidden="true" class="nav-btn-tip-arrow"></span>
      </span>
    </span>
  </nav>

  <div class="controls">
    <div class="control-group" id="theme-group">
      <button type="button" class="ctrl-btn" data-waktu="pagi" aria-label="Early morning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 7v2M5.6 10.6l1.4 1.4M18.4 10.6L17 12M2.5 14.5h2M19.5 14.5h2"/></svg>
      </button>
      <button type="button" class="ctrl-btn" data-waktu="siang" aria-label="Midday">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      </button>
      <button type="button" class="ctrl-btn" data-waktu="sore" aria-label="Afternoon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M7.5 18a4.5 4.5 0 0 1 9 0M12 4.5v3M12 7.5l-2-2M12 7.5l2-2M3 14l1.5.8M21 14l-1.5.8"/></svg>
      </button>
      <button type="button" class="ctrl-btn" data-waktu="malam" aria-label="Night">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
    <div class="control-group" id="zoom-group">
      <button id="zoom-out" type="button" class="ctrl-btn" aria-label="Perkecil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoom-in" type="button" class="ctrl-btn" aria-label="Perbesar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="control-group">
      <button id="zoom-fit" type="button" class="ctrl-btn" aria-label="Sesuaikan ke layar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </div>
    <!-- Hanya tampil di mobile (<640px): legenda di sana jadi sheet atas-permintaan, bukan panel mengambang
         permanen seperti dekstop/tab (lihat Figma "maps-mobile-menu reveal", dan #legend di bawah). -->
    <div class="control-group" id="legend-toggle-group">
      <button type="button" id="legend-toggle" class="ctrl-btn" aria-label="Buka koridor" aria-haspopup="dialog" aria-expanded="false" aria-controls="legend">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <div id="legend-scrim"></div>

  <div id="legend" aria-label="Pilih koridor">
    <button type="button" class="legend-close" id="legend-close" aria-label="Tutup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <section class="legend-base">
      <h2 class="legend-title"></h2>
      <h2 class="legend-title-mobile">Corridors</h2>
      <div id="legend-rows"></div>
    </section>
    <h2 class="legend-selected-title" hidden></h2>
    <div id="legend-selected"></div>
  </div>

  <aside id="stop-info" class="card" hidden>
    <button type="button" class="close" aria-label="Tutup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2></h2>
    <ul></ul>
    <p hidden></p>
  </aside>

  <script type="module" src="/suroboyo-bus-route/js/main.js"></script>
</body>
</html>
