<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare: Tab Labels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
      --neutral-30: #ededed;
      --neutral-70: #757575;
      --neutral-100: #0a0a0a;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 0;
      background: #fff;
      font-family: "Geist", -apple-system, sans-serif;
    }

    /* Frame: 840x491 dari Figma "Property 1=1" */
    .label { font: 400 12px/18px "Geist", sans-serif; letter-spacing: .5px; color: #757575; margin-bottom: -12px; align-self: flex-start; margin-left: calc(50% - 420px); }
    .stage {
      position: relative;
      width: 840px;
      height: 491px;
      background: #f2f3f7;
      overflow: hidden;
    }

    /* Tab switcher */
    .tabs {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      padding: 4px;
      background: #fff;
      border: 1px solid var(--neutral-30);
      border-radius: 100px;
      z-index: 2;
    }
    /* Overlay hitam berisi salinan label putih, di-clip ke tab aktif.
       clip-path + round menjaga sudut tetap lingkaran sempurna (scaleX bikin lonjong). */
    .tabs__overlay {
      position: absolute;
      top: 4px;
      right: 4px;
      bottom: 4px;
      left: 4px;
      display: flex;
      background: var(--neutral-100);
      color: #fff;
      pointer-events: none;
      user-select: none;
      clip-path: inset(0 0 0 0 round 60px);
      transition: clip-path 280ms var(--ease-out);
    }
    .tabs__overlay span {
      padding: 8px;
      font: 400 12px/18px "Geist", sans-serif;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .tab {
      position: relative;
      padding: 8px;
      border: 0;
      border-radius: 60px;
      background: none;
      font: 400 12px/18px "Geist", sans-serif;
      letter-spacing: 0.5px;
      color: var(--neutral-70);
      cursor: pointer;
      transition: color 150ms ease;
    }
    .tab[aria-selected="true"] { color: transparent; }
    .tab:focus-visible { outline: 2px solid #0030bf; outline-offset: 2px; }
    @media (hover: hover) and (pointer: fine) {
      .tab[aria-selected="false"]:hover { color: var(--neutral-100); }
    }
    .tab:active { scale: 0.96; transition: scale 150ms ease-out, color 150ms ease; }

    /* Step screenshots: 546px lebar, mulai y=97, ke-crop di bawah frame */
    .shots {
      position: absolute;
      top: 89.5px;
      left: 133.5px;
      width: 573.5px;
      height: 402px;
    }
    .shot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      opacity: 0;
      transform: translateX(var(--from, 16px)) scale(0.985);
      transition: opacity 220ms var(--ease-out), transform 260ms var(--ease-out);
      pointer-events: none;
      user-select: none;
    }
    .shot:nth-child(3) { top: 4.5px; }
    .shot.is-active {
      opacity: 1;
      transform: none;
    }
    .shot.is-leaving {
      opacity: 0;
      transform: translateX(var(--to, -16px));
      transition-duration: 160ms;
      transition-timing-function: ease-in;
    }

    @media (prefers-reduced-motion: reduce) {
      .tabs__overlay, .shot, .tab { transition: none; }
    }
  </style>
</head>
<body>
  <p class="label">A · Nama step (Figma)</p>
  <div class="stage">
    <div class="tabs" role="tablist" aria-label="Checkout steps">
      <button class="tab" role="tab" aria-selected="true">Shipping Information</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1">Shipping Method</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1">Payment Method</button>
      <div class="tabs__overlay" aria-hidden="true"><span>Shipping Information</span><span>Shipping Method</span><span>Payment Method</span></div>
    </div>
    <div class="shots">
      <img class="shot is-active" src="img/booksmart-step-1.png" alt="" draggable="false" />
      <img class="shot" src="img/booksmart-step-2.png" alt="" draggable="false" />
      <img class="shot" src="img/booksmart-step-3.png" alt="" draggable="false" />
    </div>
  </div>
  <p class="label">B · Step 1 / 2 / 3</p>
  <div class="stage">
    <div class="tabs" role="tablist" aria-label="Checkout steps">
      <button class="tab" role="tab" aria-selected="true">Step 1</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1">Step 2</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1">Step 3</button>
      <div class="tabs__overlay" aria-hidden="true"><span>Step 1</span><span>Step 2</span><span>Step 3</span></div>
    </div>
    <div class="shots">
      <img class="shot is-active" src="img/booksmart-step-1.png" alt="" draggable="false" />
      <img class="shot" src="img/booksmart-step-2.png" alt="" draggable="false" />
      <img class="shot" src="img/booksmart-step-3.png" alt="" draggable="false" />
    </div>
  </div>
  <script>
    document.querySelectorAll(".stage").forEach(function (stage) {
      var tabs = Array.prototype.slice.call(stage.querySelectorAll(".tab"));
      var shots = Array.prototype.slice.call(stage.querySelectorAll(".shot"));
      var overlay = stage.querySelector(".tabs__overlay");
      var current = 0;

      function movePill(i) {
        var t = tabs[i];
        var left = t.offsetLeft - 4;
        var right = overlay.offsetWidth - left - t.offsetWidth;
        overlay.style.clipPath = "inset(0 " + right + "px 0 " + left + "px round 60px)";
      }

      function select(next, focus) {
        if (next === current) return;
        var dir = next > current ? 1 : -1;
        var out = shots[current];
        var inn = shots[next];

        // incoming starts on the side it comes from, outgoing exits the opposite way
        inn.style.setProperty("--from", 16 * dir + "px");
        out.style.setProperty("--to", -16 * dir + "px");

        out.classList.remove("is-active");
        out.classList.add("is-leaving");
        inn.classList.remove("is-leaving");
        void inn.offsetWidth;
        inn.classList.add("is-active");

        var leaving = out;
        setTimeout(function () { leaving.classList.remove("is-leaving"); }, 180);

        tabs.forEach(function (t, i) {
          t.setAttribute("aria-selected", i === next);
          t.tabIndex = i === next ? 0 : -1;
        });
        movePill(next);
        if (focus) tabs[next].focus();
        current = next;
      }

      tabs.forEach(function (t, i) {
        t.addEventListener("click", function () { select(i); });
        t.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") select(Math.min(i + 1, tabs.length - 1), true);
          if (e.key === "ArrowLeft") select(Math.max(i - 1, 0), true);
        });
      });

      // set pill without animating on load (fonts may change tab widths)
      overlay.style.transition = "none";
      movePill(0);
      requestAnimationFrame(function () { overlay.style.transition = ""; });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          overlay.style.transition = "none";
          movePill(current);
          requestAnimationFrame(function () { overlay.style.transition = ""; });
        });
      }
    });
  </script>
</body>
</html>
