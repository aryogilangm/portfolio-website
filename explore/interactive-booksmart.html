<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore: Interactive Booksmart (Desktop)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
      --neutral-30: #ededed;
      --neutral-70: #757575;
      --neutral-100: #0a0a0a;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #fff;
      font-family: "Geist", -apple-system, sans-serif;
    }

    /* Struktur & ukuran = .iteration-demo di article (standard sementara):
       frame + radius 6 (tanpa stroke: stroke cuma untuk interactive bg putih), switcher-row (padding-top 24) di atas,
       stage rasio 840/491 di bawahnya. Isi stage pakai cqw supaya ikut skala. */
    .demo {
      width: min(100%, 960px);
      display: flex;
      flex-direction: column;
      container-type: inline-size;
      background: #f2f3f7;
      border-radius: 6px;
      overflow: hidden;
    }
    .demo__row {
      display: flex;
      justify-content: center;
      padding-top: 24px;
    }
    .stage {
      position: relative;
      aspect-ratio: 840 / 491;
      overflow: hidden;
    }

    /* Tab switcher */
    .tabs {
      position: relative;
      display: flex;
      padding: 4px;
      background: #fff;
      border: 1px solid var(--neutral-30);
      border-radius: 100px;
    }
    /* Overlay hitam berisi salinan label putih, di-clip ke tab aktif.
       clip-path + round menjaga sudut tetap lingkaran sempurna (scaleX bikin lonjong). */
    .tabs__overlay {
      position: absolute;
      top: 4px;
      right: 4px;
      bottom: 4px;
      left: 4px;
      display: flex;
      background: var(--neutral-100);
      color: #fff;
      pointer-events: none;
      user-select: none;
      clip-path: inset(0 0 0 0 round 60px);
      transition: clip-path 280ms var(--ease-out);
    }
    .tabs__overlay span {
      min-width: 80px;
      padding: 8px;
      text-align: center;
      font: 400 12px/18px "Geist", sans-serif;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .tab {
      position: relative;
      min-width: 80px;
      padding: 8px;
      text-align: center;
      border: 0;
      border-radius: 60px;
      background: none;
      font: 400 12px/18px "Geist", sans-serif;
      letter-spacing: 0.5px;
      color: var(--neutral-70);
      cursor: pointer;
      transition: color 150ms ease;
    }
    .tab[aria-selected="true"] { color: transparent; }
    .tab:focus-visible { outline: 2px solid #0030bf; outline-offset: 2px; }
    @media (hover: hover) and (pointer: fine) {
      .tab[aria-selected="false"]:hover { color: var(--neutral-100); }
    }
    .tab:active { scale: 0.96; transition: scale 150ms ease-out, color 150ms ease; }

    /* Step screenshots: 546px lebar, mulai y=97, ke-crop di bawah frame */
    /* Screenshot diperbesar x1.138 (= tinggi frame baru 559 / 491 di Figma) supaya proporsional,
       lalu dibiarkan menembus bawah frame seperti desain. Angka dalam cqw (1cqw = 8.4px @840). */
    .shots {
      position: absolute;
      top: 3.98cqw;
      left: 11.17cqw;
      width: 77.73cqw;
    }
    /* Mobile (<768px): sama seperti .iteration-demo__stage di article, rasio 840/491 dilepas
       (screenshot cuma jadi ~1/3 lebar kalau dipaksa). Screenshot dibuat hampir selebar frame
       (konten 90cqw, gap 16px dari switcher) dan tinggi stage = gap + tinggi gambar, jadi
       ujung bawahnya tetap menembus tepi frame. */
    @media (max-width: 767px) {
      .stage { aspect-ratio: auto; height: calc(16px + 65cqw); }
      .shots { top: calc(16px - 1.236cqw); left: 2.77cqw; width: 94.5cqw; }
    }

    .shot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      opacity: 0;
      /* keluar: sama dengan body.is-leaving di css/style.css */
      transition: opacity 160ms ease-in;
      pointer-events: none;
      user-select: none;
    }
    /* masuk: sama dengan page-fade-in (opacity saja, 220ms ease-out) */
    .shot.is-active {
      opacity: 1;
      transition: opacity 220ms ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .tabs__overlay, .shot, .tab { transition: none; }
    }
  </style>
</head>
<body>
  <div class="demo">
   <div class="demo__row">
    <div class="tabs" role="tablist" aria-label="Checkout steps">
      <button class="tab" role="tab" aria-selected="true" data-step="0">Step 1</button>
      <button class="tab" role="tab" aria-selected="false" data-step="1" tabindex="-1">Step 2</button>
      <button class="tab" role="tab" aria-selected="false" data-step="2" tabindex="-1">Step 3</button>
      <div class="tabs__overlay" id="overlay" aria-hidden="true">
        <span>Step 1</span><span>Step 2</span><span>Step 3</span>
      </div>
    </div>
   </div>

   <div class="stage">
    <div class="shots">
      <img class="shot is-active" src="img/booksmart-step-1.png" alt="Checkout step 1: shipping information" draggable="false" />
      <img class="shot" src="img/booksmart-step-2.png" alt="Checkout step 2: shipping method" draggable="false" />
      <img class="shot" src="img/booksmart-step-3.png" alt="Checkout step 3: payment method" draggable="false" />
    </div>
   </div>
  </div>

  <script>
    (function () {
      var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
      var shots = Array.prototype.slice.call(document.querySelectorAll(".shot"));
      var overlay = document.getElementById("overlay");
      var current = 0;

      function movePill(i) {
        var t = tabs[i];
        var left = t.offsetLeft - 4;
        var right = overlay.offsetWidth - left - t.offsetWidth;
        overlay.style.clipPath = "inset(0 " + right + "px 0 " + left + "px round 60px)";
      }

      function select(next, focus) {
        if (next === current) return;
        shots[current].classList.remove("is-active");
        shots[next].classList.add("is-active");

        tabs.forEach(function (t, i) {
          t.setAttribute("aria-selected", i === next);
          t.tabIndex = i === next ? 0 : -1;
        });
        movePill(next);
        if (focus) tabs[next].focus();
        current = next;
      }

      tabs.forEach(function (t, i) {
        t.addEventListener("click", function () { select(i); });
        t.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") select(Math.min(i + 1, tabs.length - 1), true);
          if (e.key === "ArrowLeft") select(Math.max(i - 1, 0), true);
        });
      });

      // set pill without animating on load (fonts may change tab widths)
      overlay.style.transition = "none";
      movePill(0);
      requestAnimationFrame(function () { overlay.style.transition = ""; });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          overlay.style.transition = "none";
          movePill(current);
          requestAnimationFrame(function () { overlay.style.transition = ""; });
        });
      }
    })();
  </script>
</body>
</html>
